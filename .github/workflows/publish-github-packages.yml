# ============================================================================
# publish-github-packages.yml — 把插件发布到 GitHub Packages (npm registry)
#
# 注意: 主发布目标是 **npmjs.org**(见 publish-npmjs.yml) —— public 包可匿名安装。
# GitHub Packages 作为镜像保留, 但其 npm registry 即使 public 包也要求 token 才能拉取。
#
# 文档: https://docs.github.com/en/packages/working-with-a-github-packages-registry/working-with-the-npm-registry
#
# 触发方式 (发布策略与 npmjs 相反 —— 这里是【自动镜像】):
#   - push tag  v*        → 自动真实发布该 tag 对应的版本, 无需人工介入
#   - workflow_dispatch   → 手动重发 / 演练; dry_run 默认 true(只校验)
#
# 为什么 GHP 自动、npmjs 手动:
#   GitHub Packages 允许同一版本被拒绝后重试(重复发布返回冲突, 不消耗版本号),
#   出错代价低, 适合作为自动镜像。而 npm 的版本号一经使用即永久作废
#   (unpublish 只删产物, time 表留下墓碑), 误发无法回收, 因此 npmjs 那条
#   坚持"tag push 只校验, 手动 dispatch 才真发布"。
#
# 认证: 使用内置 GITHUB_TOKEN(需要 packages: write 权限), 无需额外 PAT。
# 包名必须是作用域包名(@steven-stack-s/dsh-memos-local) —— GitHub Packages
# 只接受 scoped 包名。
#
# 版本策略: `<上游版本>-dsh.<本地修订号>` (例如 2.0.19-dsh.1); tag 即 v<版本>
# (v2.0.19-dsh.1)。与 npmjs 主目标保持同一版本体系, 见 README。
# 用 prerelease 段而非 build metadata 的原因见 publish-npmjs.yml 顶部注释
# (npm 在发布路径上会剥掉 `+` 段, 导致撞上已烧毁的版本号)。
# 发布前校验 tag 与 package.json 的 version 是否一致, 不一致直接失败。
# ============================================================================
name: publish-github-packages

on:
  push:
    tags:
      - 'v*'
  # Manual dispatch stays available for re-running a mirror publish or for a
  # dry-run rehearsal. It defaults to dry-run so an accidental click cannot
  # publish; set dry_run=false only when you actually mean it.
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只做打包校验, 不真正发布 (tag push 不受此开关影响)'
        type: boolean
        default: true

concurrency:
  group: publish-github-packages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (GitHub Packages registry)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@steven-stack-s'

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          EXPECTED="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG expected_tag=$EXPECTED"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "::error::tag $TAG 与 package.json 版本不匹配 (期望 $EXPECTED)"
            echo "::error::版本形如 <上游版本>-dsh.<n>, tag 即 v<版本> (例如 2.0.19-dsh.1 ⇄ v2.0.19-dsh.1)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build (prepack also runs this)
        run: npm run build:package

      - name: Publish to GitHub Packages
        # package.json 的 publishConfig.registry 指向 npmjs(主目标),
        # 这里必须显式覆盖回 GitHub Packages。
        # tag push 一律 dry-run; 手动触发时才看输入 (默认也是 dry-run)。
        run: |
          set -eu
          if [ "${DRY_RUN}" = "true" ]; then
            echo "::notice::dry_run=true —— 只做打包校验, 不发布"
            npm publish --registry https://npm.pkg.github.com --dry-run
          else
            npm publish --registry https://npm.pkg.github.com
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # tag push 一律真实发布(GHP 作为自动镜像); 手动触发时才看输入(默认 dry-run)。
          DRY_RUN: ${{ github.event_name == 'push' && 'false' || inputs.dry_run }}

      - name: Summary
        run: |
          echo "package: $(node -p "require('./package.json').name + '@' + require('./package.json').version")"
          echo "view: https://github.com/steven-stack-s?tab=packages"
