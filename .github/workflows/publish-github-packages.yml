# ============================================================================
# publish-github-packages.yml — 把插件发布到 GitHub Packages (npm registry)
#
# 注意: 主发布目标是 **npmjs.org**(见 publish-npmjs.yml) —— public 包可匿名安装。
# GitHub Packages 作为镜像保留, 但其 npm registry 即使 public 包也要求 token 才能拉取。
#
# 文档: https://docs.github.com/en/packages/working-with-a-github-packages-registry/working-with-the-npm-registry
#
# 触发方式:
#   - push tag  v*        → 用该 tag 发布对应版本
#   - workflow_dispatch   → 手动发布当前 main 的版本
#
# 认证: 使用内置 GITHUB_TOKEN(需要 packages: write 权限), 无需额外 PAT。
# 包名必须是作用域包名(@steven-stack-s/dsh-memos-local) —— GitHub Packages
# 只接受 scoped 包名。
#
# 版本策略: `<上游版本>+dsh.<本地修订号>` (例如 2.0.19+dsh.1); git tag 用 `-`
# 代替 `+` (v2.0.19-dsh.1)。与 npmjs 主目标保持同一版本体系, 见 README。
# 发布前校验 tag 与 package.json 的 version 是否一致, 不一致直接失败。
# ============================================================================
name: publish-github-packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只做打包校验, 不真正发布 (建议先跑一次 true)'
        type: boolean
        default: true

concurrency:
  group: publish-github-packages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (GitHub Packages registry)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@steven-stack-s'

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          # tag 用 `-` 表示 semver 的 `+` build metadata 段:
          #   tag v2.0.19-dsh.1  ⇄  package.json "2.0.19+dsh.1"
          EXPECTED="$(node -p "
            const v = require('./package.json').version;
            'v' + v.replace('+', '-');
          ")"
          echo "tag=$TAG expected_tag=$EXPECTED"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "::error::tag $TAG 与 package.json 版本不匹配 (期望 $EXPECTED)"
            echo "::error::约定: package.json 用 '+' (2.0.19+dsh.1), git tag 用 '-' (v2.0.19-dsh.1)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build (prepack also runs this)
        run: npm run build:package

      - name: Publish to GitHub Packages
        # package.json 的 publishConfig.registry 指向 npmjs(主目标),
        # 这里必须显式覆盖回 GitHub Packages。
        # tag push 一律 dry-run; 手动触发时才看输入 (默认也是 dry-run)。
        run: |
          set -eu
          if [ "${DRY_RUN}" = "true" ]; then
            echo "::notice::dry_run=true —— 只做打包校验, 不发布"
            npm publish --registry https://npm.pkg.github.com --dry-run
          else
            npm publish --registry https://npm.pkg.github.com
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'push' && 'true' || inputs.dry_run }}

      - name: Summary
        run: |
          echo "package: $(node -p "require('./package.json').name + '@' + require('./package.json').version")"
          echo "view: https://github.com/steven-stack-s?tab=packages"
