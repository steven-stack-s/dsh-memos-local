# ============================================================================
# publish-npmjs.yml — 把插件发布到 npmjs.org (公共 npm registry)
#
# 这是**主发布目标**: npmjs 上的 public 包人人可匿名安装, 无需任何 token。
#   npm install @steven-stack-s/dsh-memos-local
#   dsh plugin --profile web add @steven-stack-s/dsh-memos-local
#
# 触发方式 (npmjs 是【人工确认】渠道, 与 GHP 的自动镜像相反):
#   - push tag  v*        → 校验通过后 **dry-run 打包**(不真正发布)
#   - workflow_dispatch   → 手动发布; dry_run 默认 true, 需显式关闭才真正发布
#
# 为什么 npm 必须人工确认: 版本号一经使用即永久作废 —— unpublish 只删除产物,
# packument 的 time 表会留下墓碑, 之后任何同号发布都被拒
# (400 Cannot publish over previously published version)。误发无法回收,
# 所以这里坚持"推 tag 只校验, 手动 dispatch 才真发布"。
# GitHub Packages 那条则是自动的(见 publish-github-packages.yml):
# 重复发布会返回冲突而非消耗版本号, 出错代价低。
#
# 认证: 需要仓库 Secret —— 名字用 `NPM_TOKEN` 或 `NPM` 均可(workflow 两者兼容)。
#       去 npmjs.com 生成 **Granular Access Token** 并勾选 **Bypass 2FA**
#       (Access Tokens → Generate New Token → Granular Access Token)。
#       注意: 账号开了 2FA 时, Classic 的 Publish 类型 token 发布会 403;
#       必须用带 bypass 2FA 的 granular token(或改用 Trusted Publishing/OIDC)。
#
# 版本策略: `<上游版本>-dsh.<本地修订号>`, 例如 2.0.19-dsh.1 —— 见 README
#           "Version policy"。tag 即 `v<版本>` (v2.0.19-dsh.1)。
#           注意: 这里刻意使用 semver **prerelease** 段 (`-dsh.N`) 而不是 build
#           metadata (`+dsh.N`)。实测证实 npm 在打包/发布路径上会剥掉 `+` 段:
#           package.json 写 `2.0.19+dsh.1`, 而 `npm publish` 实际构造的 tarball 与
#           PUT 的版本都是 `2.0.19`, 于是撞上已烧毁的版本号并返回
#           400 Cannot publish over previously published version。
#           代价: prerelease 不满足 `^2.0.19` 范围 (语义上低于 2.0.19), 使用者应显式
#           安装该版本或依赖 `latest` dist-tag, 而非依赖 caret 范围。
#
# 防呆: 发布前查询 registry, 若该版本号已被占用则 fail fast —— npm 的 unpublish
#       只删除产物, 版本号永久作废 (time.unpublished 会留下墓碑), 盲发必然撞 400。
# ============================================================================
name: publish-npmjs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只做打包校验, 不真正发布 (建议先跑一次 true)'
        type: boolean
        default: true

concurrency:
  group: publish-npmjs
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (npmjs registry)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          EXPECTED="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG expected_tag=$EXPECTED"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "::error::tag $TAG 与 package.json 版本不匹配 (期望 $EXPECTED)"
            echo "::error::版本形如 <上游版本>-dsh.<n>, tag 即 v<版本> (例如 2.0.19-dsh.1 ⇄ v2.0.19-dsh.1)"
            exit 1
          fi

      - name: Guard against missing NPM_TOKEN
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::缺少 NPM_TOKEN secret; 请在仓库 Settings → Secrets and variables → Actions 添加"
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NPM }}

      - name: Refuse to publish an already-used version
        run: |
          set -eu
          # 读路径 404 无法区分 "未发布" 与 "已 unpublish 占用", 因此查完整
          # packument 的 time 表 —— unpublish 过的版本号会留在那里。
          # 用 Node fetch 而非 curl: runner 上 curl 未必存在, 而 `curl ... || echo '{}'`
          # 会把取数失败静默变成空对象, 导致守卫放行 —— 必须 fail closed。
          VERSION="$(node -p "require('./package.json').version")" \
          NAME="$(node -p "require('./package.json').name")" \
          node -e "
          (async () => {
            const name = process.env.NAME, want = process.env.VERSION;
            console.log('checking ' + name + '@' + want + ' ...');
            const url = 'https://registry.npmjs.org/' + encodeURIComponent(name);
            let j;
            try {
              const r = await fetch(url, { headers: { Accept: 'application/json' } });
              if (!r.ok) throw new Error('HTTP ' + r.status);
              j = await r.json();
            } catch (e) {
              console.error('::error::无法查询 registry (' + e.message + '); 为避免重复发布, 拒绝继续');
              process.exit(1);
            }
            const time = j.time || {};
            const unpublished = (time.unpublished && time.unpublished.versions) || [];
            if (time[want]) {
              const isUnpub = unpublished.includes(want);
              console.error('::error::版本 ' + want + ' 已被占用' + (isUnpub ? ' (曾发布后被 unpublish, 墓碑仍在 time 表中)' : ''));
              console.error('::error::npm 的版本号一经使用即永久作废, 请递增 -dsh.N 或切换到新的上游基线');
              process.exit(1);
            }
            console.log('OK: ' + want + ' 未被使用, 可以发布');
          })();
          "

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build (prepack also runs this)
        run: npm run build:package

      - name: Publish to npmjs
        run: |
          set -eu
          if [ "${DRY_RUN}" = "true" ]; then
            echo "::notice::dry_run=true —— 只做打包校验, 不发布"
            npm publish --registry https://registry.npmjs.org --access public --dry-run
          else
            npm publish --registry https://registry.npmjs.org --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NPM }}
          # tag push 一律 dry-run; 手动触发时才看输入 (默认也是 dry-run)
          DRY_RUN: ${{ github.event_name == 'push' && 'true' || inputs.dry_run }}

      - name: Summary
        run: |
          echo "package: $(node -p "require('./package.json').name + '@' + require('./package.json').version")"
          echo "view: https://www.npmjs.com/package/@steven-stack-s/dsh-memos-local"
