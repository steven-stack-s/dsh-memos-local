# ============================================================================
# publish-npmjs.yml — 把插件发布到 npmjs.org (公共 npm registry)
#
# 这是**主发布目标**: npmjs 上的 public 包人人可匿名安装, 无需任何 token。
#   npm install @steven-stack-s/dsh-memos-local
#   dsh plugin --profile web add @steven-stack-s/dsh-memos-local
#
# 触发方式:
#   - push tag  v*        → 用该 tag 发布对应版本
#   - workflow_dispatch   → 手动发布当前 main 的版本
#
# 认证: 需要仓库 Secret —— 名字用 `NPM_TOKEN` 或 `NPM` 均可(workflow 两者兼容)。
#       去 npmjs.com 生成 **Granular Access Token** 并勾选 **Bypass 2FA**
#       (Access Tokens → Generate New Token → Granular Access Token)。
#       注意: 账号开了 2FA 时, Classic 的 Publish 类型 token 发布会 403;
#       必须用带 bypass 2FA 的 granular token(或改用 Trusted Publishing/OIDC)。
#
# 版本策略: 与上游 @memtensor/memos-local-plugin 严格一致(见 README)。
# 发布前校验 tag 与 package.json 的 version 是否一致, 不一致直接失败。
# ============================================================================
name: publish-npmjs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: publish-npmjs
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (npmjs registry)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          PKG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG pkg=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $TAG 与 package.json 版本 $PKG 不一致; 版本必须严格对齐上游"
            exit 1
          fi

      - name: Guard against missing NPM_TOKEN
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::缺少 NPM_TOKEN secret; 请在仓库 Settings → Secrets and variables → Actions 添加"
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NPM }}

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build (prepack also runs this)
        run: npm run build:package

      - name: Publish to npmjs
        run: npm publish --registry https://registry.npmjs.org --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NPM }}

      - name: Summary
        run: |
          echo "published: $(node -p "require('./package.json').name + '@' + require('./package.json').version")"
          echo "view: https://www.npmjs.com/package/@steven-stack-s/dsh-memos-local"
