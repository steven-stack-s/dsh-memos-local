# ============================================================================
# publish-npm.yml — 把插件发布到 GitHub Packages (npm registry)
#
# 文档: https://docs.github.com/en/packages/working-with-a-github-packages-registry/working-with-the-npm-registry
#
# 触发方式:
#   - push tag  v*        → 用该 tag 发布对应版本
#   - workflow_dispatch   → 手动发布当前 main 的版本
#
# 认证: 使用内置 GITHUB_TOKEN(需要 packages: write 权限), 无需额外 PAT。
# 包名必须是作用域包名(@steven-stack-s/dsh-memos-local) —— GitHub Packages
# 只接受 scoped 包名。
#
# 版本策略: 与上游 @memtensor/memos-local-plugin 严格一致(见 README)。
# 发布前校验 tag 与 package.json 的 version 是否一致, 不一致直接失败。
# ============================================================================
name: publish-npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (GitHub Packages registry)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@steven-stack-s'

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          PKG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG pkg=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $TAG 与 package.json 版本 $PKG 不一致; 版本必须严格对齐上游"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build (prepack also runs this)
        run: npm run build:package

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "published: $(node -p "require('./package.json').name + '@' + require('./package.json').version")"
          echo "view: https://github.com/steven-stack-s?tab=packages"
